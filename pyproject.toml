[project]
name = "keystone"
version = "0.1.0"
description = "Sales and marketing chatbot backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "python-dotenv",
    "sqlalchemy",
    "psycopg2-binary",
    "psycopg[binary]",
    "psycopg-pool",
    "langgraph-checkpoint-postgres",
    "langchain-google-genai>=2.1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[dependency-groups]
dev = [
    "deepeval>=4.2.9",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: marks tests as LLM evaluation benchmarks (run explicitly with 'pytest evals/')",
]
